services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --strictPort"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(async r => { if (!r.ok || !(await r.text()).includes('/src/main.tsx')) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  node_modules:
